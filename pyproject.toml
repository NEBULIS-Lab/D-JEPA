[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djepa"
version = "0.1.0"
description = "D-JEPA: A Decision-Aligned Latent World Model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.3"]

[project.scripts]
djepa-evaluate = "djepa.evaluate:main"
djepa-train = "djepa.train:main"

[tool.setuptools.packages.find]
where = ["src"]
