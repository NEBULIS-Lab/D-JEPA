# The module-specific 448/64 split is read from the fitting-pool metadata.
module: pusht-relational
train: data/D-JEPA-supervision-v1/pusht/train
output: outputs/pusht-relational-trained
updates: 1000
seed: 3072
batch_size: 8
learning_rate: 0.0003
weight_decay: 0.0001
max_grad_norm: 1.0
tail_k: 16
evaluate_every: 50
hidden_dim: 64
low_rank: 8
max_correction: 0.2
mg_grid_step: 0.05
